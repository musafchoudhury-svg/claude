<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manna the Beaver - Auto Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #f5deb3;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #c8860a;
      text-shadow: 0 0 18px #c8860a99;
      letter-spacing: 3px;
    }
    #gameCanvas {
      border: 3px solid #c8860a;
      border-radius: 6px;
      box-shadow: 0 0 40px #c8860a55;
      display: block;
      max-width: 100%;
    }
    #ui {
      margin-top: 10px;
      display: flex;
      gap: 36px;
      font-size: 1.05rem;
    }
    #controls {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #a07040;
    }
  </style>
</head>
<body>
  <h1>MANNA THE BEAVER</h1>
  <canvas id="gameCanvas" width="900" height="360"></canvas>
  <div id="ui">
    <span>SCORE: <span id="score">0</span>m</span>
    <span>BEST: <span id="best">0</span>m</span>
    <span>SPEED: <span id="speed">1.0</span>x</span>
  </div>
  <div id="controls">SPACE / UP / TAP — jump</div>

  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GROUND_Y = H - 70;
  const GRAVITY = 0.6;
  const JUMP_V = -14.5;
  const BASE_SPEED = 5.5;

  const C = {
    beaver:      '#8B4513',
    beaverDark:  '#5c2d09',
    beaverLight: '#cd853f',
    beaverHL:    '#e8a060',
    tail:        '#6b3410',
    tailTex:     '#3e1c06',
    eye:         '#0a0500',
    eyeShine:    '#ffffff',
    tooth:       '#fffde7',
    toothLine:   '#d4c84a',
    ear:         '#7a3810',
    earInner:    '#c06030',
    log:         '#795548',
    logDark:     '#4e342e',
    logLight:    '#a1887f',
    rock:        '#78909c',
    rockDark:    '#455a64',
    rockLight:   '#b0bec5',
    tree:        '#2e7d32',
    treeTrunk:   '#5d4037',
    mtn1:        '#607d8b',
    mtn2:        '#455a64',
    mtn3:        '#37474f',
    cloud:       'rgba(255,255,255,0.82)',
    grass1:      '#388e3c',
    grass2:      '#2e7d32',
    water:       '#1565c0',
    waterLight:  '#42a5f5',
  };

  let state, manna, obstacles, clouds, trees, particles, score, best, speedMult, frame;
  let bgX = 0, mtX = 0;

  function init() {
    state = 'idle'; score = 0; speedMult = 1; frame = 0; bgX = mtX = 0;
    manna = { x: 140, y: GROUND_Y, vy: 0, onGround: true, legPhase: 0, tailWag: 0, bobble: 0, squash: 1 };
    obstacles = [];
    clouds = [
      { x: 120, y: 55, w: 110, speed: 0.35 }, { x: 380, y: 80, w: 75, speed: 0.25 },
      { x: 680, y: 40, w: 95, speed: 0.45 },  { x: 820, y: 65, w: 60, speed: 0.3 },
    ];
    trees = [{ x: 200, h: 70 }, { x: 420, h: 55 }, { x: 600, h: 80 }, { x: 750, h: 60 }, { x: 900, h: 75 }];
    particles = [];
    nextObstacleIn = 90;
  }

  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if ((e.code === 'Space' || e.code === 'ArrowUp') && !keys._held) { keys._held = true; handleJump(); }
    if (e.code === 'Space') e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space' || e.code === 'ArrowUp') keys._held = false;
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); handleJump(); });

  function handleJump() {
    if (state === 'idle') { state = 'running'; return; }
    if (state === 'dead') { init(); state = 'running'; return; }
    if (manna.onGround) {
      manna.vy = JUMP_V; manna.onGround = false; manna.squash = 0.6;
      spawnDust(manna.x + 18, GROUND_Y + 18, 8);
    }
  }

  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: (Math.random()-.5)*5, vy: -Math.random()*3.5-.5,
        life: 1, decay: .055+Math.random()*.04, r: 2+Math.random()*4,
        color: ['#8B4513','#cd853f','#a0522d'][Math.floor(Math.random()*3)] });
    }
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 22; i++) {
      const ang = Math.random()*Math.PI*2, spd = 2+Math.random()*5;
      particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd-2,
        life: 1, decay: .035+Math.random()*.03, r: 3+Math.random()*5,
        color: [C.beaver,C.beaverLight,C.beaverDark,C.tail,'#fff'][Math.floor(Math.random()*5)] });
    }
  }

  let nextObstacleIn = 90;
  function maybeSpawnObstacle() {
    if (--nextObstacleIn > 0) return;
    nextObstacleIn = Math.floor(55 + Math.random()*75) / speedMult;
    const roll = Math.random();
    if (roll < 0.4) {
      const h = 32+Math.floor(Math.random()*22);
      obstacles.push({ type:'log', x:W+30, y:GROUND_Y+18-h, w:24, h });
    } else if (roll < 0.75) {
      const s = 24+Math.floor(Math.random()*20);
      obstacles.push({ type:'rock', x:W+30, y:GROUND_Y+18-s, w:s*1.4, h:s });
    } else {
      const h1=28+Math.floor(Math.random()*14), h2=22+Math.floor(Math.random()*14);
      obstacles.push({ type:'log', x:W+30, y:GROUND_Y+18-h1, w:22, h:h1 });
      obstacles.push({ type:'log', x:W+62, y:GROUND_Y+18-h2, w:22, h:h2 });
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
    g.addColorStop(0,'#2c5f8a'); g.addColorStop(.5,'#5ba3d0'); g.addColorStop(1,'#c8e8f5');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,GROUND_Y);
  }

  function drawMountains() {
    const layers = [
      { col:C.mtn3, peaks:[[0,160],[120,80],[260,120],[400,60],[540,100],[700,70],[900,90],[900,160]], off:.1 },
      { col:C.mtn2, peaks:[[0,170],[80,100],[200,130],[350,80],[500,110],[650,90],[800,120],[900,170]], off:.2 },
      { col:C.mtn1, peaks:[[0,180],[60,120],[160,150],[300,100],[450,130],[600,105],[780,140],[900,180]], off:.3 },
    ];
    layers.forEach(l => {
      ctx.fillStyle=l.col; ctx.beginPath();
      const shift=(mtX*l.off)%900;
      ctx.moveTo(0,GROUND_Y);
      l.peaks.forEach(([px,py])=>ctx.lineTo((px-shift+1800)%900,py));
      ctx.lineTo(W,GROUND_Y); ctx.closePath(); ctx.fill();
    });
  }

  function drawTree(tx, th) {
    ctx.fillStyle=C.treeTrunk;
    ctx.fillRect(tx-5, GROUND_Y+18-th*.45, 10, th*.45);
    ctx.fillStyle=C.tree;
    ctx.beginPath(); ctx.moveTo(tx,GROUND_Y+18-th); ctx.lineTo(tx+28,GROUND_Y+18-th*.5); ctx.lineTo(tx-28,GROUND_Y+18-th*.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx,GROUND_Y+18-th*.75); ctx.lineTo(tx+22,GROUND_Y+18-th*.3); ctx.lineTo(tx-22,GROUND_Y+18-th*.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#43a047';
    ctx.beginPath(); ctx.moveTo(tx-6,GROUND_Y+18-th); ctx.lineTo(tx+10,GROUND_Y+18-th*.55); ctx.lineTo(tx-10,GROUND_Y+18-th*.55); ctx.closePath(); ctx.fill();
  }

  function drawGround() {
    const g=ctx.createLinearGradient(0,GROUND_Y+18,0,H);
    g.addColorStop(0,'#6b4423'); g.addColorStop(1,'#2a0f00');
    ctx.fillStyle=g; ctx.fillRect(0,GROUND_Y+18,W,H-GROUND_Y-18);
    ctx.fillStyle=C.grass1; ctx.fillRect(0,GROUND_Y+12,W,10);
    ctx.fillStyle=C.grass2; ctx.fillRect(0,GROUND_Y+16,W,5);
    ctx.fillStyle='#2e7d32';
    for(let i=0;i<18;i++){
      const dx=((i*52-bgX*.5)%(W+60)+W+60)%(W+60)-30;
      ctx.beginPath();
      ctx.moveTo(dx-5,GROUND_Y+12); ctx.lineTo(dx,GROUND_Y+3); ctx.lineTo(dx+3,GROUND_Y+9);
      ctx.lineTo(dx+7,GROUND_Y+1); ctx.lineTo(dx+11,GROUND_Y+11); ctx.lineTo(dx+16,GROUND_Y+12);
      ctx.fill();
    }
    ctx.fillStyle='#4a2a10';
    for(let i=0;i<14;i++){
      const dx=((i*65-bgX*.55)%(W+80)+W+80)%(W+80)-40;
      ctx.beginPath(); ctx.ellipse(dx,GROUND_Y+30,7,4,.2,0,Math.PI*2); ctx.fill();
    }
    for(let i=0;i<3;i++){
      const dx=((i*310-bgX*.52)%(W+100)+W+100)%(W+100)-50;
      ctx.fillStyle=C.water; ctx.beginPath(); ctx.ellipse(dx,GROUND_Y+38,28,7,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=C.waterLight; ctx.beginPath(); ctx.ellipse(dx-6,GROUND_Y+35,10,3,-.3,0,Math.PI*2); ctx.fill();
    }
  }

  function drawCloud(c) {
    ctx.fillStyle=C.cloud;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.w*.5,20,0,0,Math.PI*2);
    ctx.ellipse(c.x-c.w*.28,c.y+7,c.w*.32,15,0,0,Math.PI*2);
    ctx.ellipse(c.x+c.w*.28,c.y+9,c.w*.32,15,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(c.x-5,c.y-4,c.w*.25,8,-.2,0,Math.PI*2); ctx.fill();
  }

  function drawLog(o) {
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,GROUND_Y+24,o.w*.6,6,0,0,Math.PI*2); ctx.fill();
    const g=ctx.createLinearGradient(o.x,0,o.x+o.w,0);
    g.addColorStop(0,C.logDark); g.addColorStop(.35,C.log); g.addColorStop(.65,C.logLight); g.addColorStop(1,C.logDark);
    ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,5); ctx.fill();
    ctx.strokeStyle=C.logDark; ctx.lineWidth=1;
    for(let i=1;i<5;i++){
      const ly=o.y+(o.h/5)*i;
      ctx.beginPath(); ctx.moveTo(o.x+3,ly); ctx.lineTo(o.x+o.w-3,ly); ctx.stroke();
    }
    ctx.fillStyle=C.logDark;
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h,o.w/2-2,7,0,0,Math.PI); ctx.fill();
    ctx.strokeStyle='#3e2010'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h,o.w*.28,4,0,0,Math.PI); ctx.stroke();
    ctx.fillStyle='#5a3520';
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.ellipse(o.x+4+i*(o.w/3),o.y+o.h*.4,3,2,.4,0,Math.PI*2); ctx.fill();
    }
  }

  function drawRock(o) {
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,GROUND_Y+24,o.w*.55,7,0,0,Math.PI*2); ctx.fill();
    const g=ctx.createRadialGradient(o.x+o.w*.38,o.y+o.h*.35,2,o.x+o.w/2,o.y+o.h/2,o.w*.55);
    g.addColorStop(0,C.rockLight); g.addColorStop(.5,C.rock); g.addColorStop(1,C.rockDark);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h*.52,o.w/2,o.h/2,-.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.rockDark; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(o.x+o.w*.5,o.y+o.h*.2); ctx.lineTo(o.x+o.w*.65,o.y+o.h*.55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x+o.w*.35,o.y+o.h*.4); ctx.lineTo(o.x+o.w*.25,o.y+o.h*.7); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.33,o.y+o.h*.28,o.w*.17,o.h*.16,-.4,0,Math.PI*2); ctx.fill();
  }

  function drawBeaver(m) {
    const x=m.x, y=m.y, lp=m.legPhase, sq=m.squash;
    ctx.save();
    const S=38, bx=x-S/2, by=y-Math.round(S*sq), bh=Math.round(S*sq), bw=Math.round(S/sq);

    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x+4,GROUND_Y+22,bw*.55,6,0,0,Math.PI*2); ctx.fill();

    // tail
    ctx.save();
    ctx.translate(bx-2, by+bh*.7);
    ctx.rotate(0.18+Math.sin(frame*.1)*.12);
    const tg=ctx.createLinearGradient(-24,0,8,0);
    tg.addColorStop(0,C.tailTex); tg.addColorStop(.5,C.tail); tg.addColorStop(1,C.beaverDark);
    ctx.fillStyle=tg;
    ctx.beginPath(); ctx.ellipse(-14,0,22,10,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.tailTex; ctx.lineWidth=.7;
    for(let r=0;r<3;r++) for(let c2=0;c2<5;c2++){
      ctx.beginPath(); ctx.arc(-26+c2*5+(r%2)*2.5,-3+r*5,2.5,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();

    // legs
    const l1=m.onGround?Math.abs(Math.sin(lp))*7:0, l2=m.onGround?Math.abs(Math.sin(lp+Math.PI))*7:0;
    ctx.fillStyle=C.beaverDark;
    ctx.beginPath(); ctx.roundRect(bx+4,y-4+l2,11,10,3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(bx+bw-16,y-4+l1,11,10,3); ctx.fill();
    ctx.fillStyle='#2a0a00';
    ctx.beginPath(); ctx.ellipse(bx+9,y+6+l2,5,3,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+bw-11,y+6+l1,5,3,0,0,Math.PI*2); ctx.fill();

    // body
    const bg=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
    bg.addColorStop(0,C.beaverHL); bg.addColorStop(.4,C.beaver); bg.addColorStop(1,C.beaverDark);
    ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill();
    ctx.fillStyle=C.beaverHL;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+bw,by); ctx.lineTo(bx+bw+7,by-7); ctx.lineTo(bx+7,by-7); ctx.closePath(); ctx.fill();
    const sg=ctx.createLinearGradient(bx+bw,by,bx+bw+7,by-7);
    sg.addColorStop(0,C.beaverDark); sg.addColorStop(1,'#3a1505');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.moveTo(bx+bw,by); ctx.lineTo(bx+bw+7,by-7); ctx.lineTo(bx+bw+7,by+bh-7); ctx.lineTo(bx+bw,by+bh); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.beaverLight;
    ctx.beginPath(); ctx.roundRect(bx+bw*.3,by+bh*.35,bw*.4,bh*.45,5); ctx.fill();
    ctx.strokeStyle='rgba(60,20,5,0.25)'; ctx.lineWidth=.8;
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(bx+4,by+bh*.15+i*(bh*.14)); ctx.lineTo(bx+bw-4,by+bh*.15+i*(bh*.14)); ctx.stroke(); }
    ctx.fillStyle=C.beaverDark;
    ctx.beginPath(); ctx.roundRect(bx+bw-3,by+bh*.25,9,7,3); ctx.fill();

    // ears
    ctx.fillStyle=C.ear; ctx.beginPath(); ctx.roundRect(bx+5,by-20,12,16,[6,6,2,2]); ctx.fill();
    ctx.fillStyle=C.earInner; ctx.beginPath(); ctx.roundRect(bx+8,by-17,6,10,[4,4,2,2]); ctx.fill();
    ctx.fillStyle=C.ear; ctx.beginPath(); ctx.roundRect(bx+bw-18,by-20,12,16,[6,6,2,2]); ctx.fill();
    ctx.fillStyle=C.earInner; ctx.beginPath(); ctx.roundRect(bx+bw-15,by-17,6,10,[4,4,2,2]); ctx.fill();

    // eye
    ctx.fillStyle='#f0e0cc'; ctx.beginPath(); ctx.ellipse(bx+bw*.72,by+bh*.28,7,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.eye; ctx.beginPath(); ctx.arc(bx+bw*.72+1,by+bh*.28,4.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.eyeShine; ctx.beginPath(); ctx.arc(bx+bw*.72+2,by+bh*.28-2,1.8,0,Math.PI*2); ctx.fill();

    // nose
    ctx.fillStyle='#1a0500'; ctx.beginPath(); ctx.ellipse(bx+bw*.82,by+bh*.45,5,4,.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0200';
    ctx.beginPath(); ctx.ellipse(bx+bw*.79,by+bh*.44,1.5,1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx+bw*.86,by+bh*.44,1.5,1,0,0,Math.PI*2); ctx.fill();

    // teeth
    ctx.fillStyle=C.tooth;
    ctx.beginPath(); ctx.roundRect(bx+bw*.72,by+bh*.55,7,9,[0,0,3,3]); ctx.fill();
    ctx.beginPath(); ctx.roundRect(bx+bw*.81,by+bh*.55,7,9,[0,0,3,3]); ctx.fill();
    ctx.strokeStyle=C.toothLine; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(bx+bw*.795,by+bh*.55); ctx.lineTo(bx+bw*.795,by+bh*.55+9); ctx.stroke();
    ctx.fillStyle='rgba(200,190,80,0.3)';
    ctx.beginPath(); ctx.roundRect(bx+bw*.72+1,by+bh*.56,3,7,[0,0,1,1]); ctx.fill();

    // whiskers
    ctx.strokeStyle='rgba(230,200,160,0.8)'; ctx.lineWidth=.9;
    const wx=bx+bw*.76, wy=by+bh*.48;
    [[-12,-3],[-14,0],[-12,3]].forEach(([dx,dy])=>{ ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(wx+dx,wy+dy); ctx.stroke(); });
    [[12,-3],[14,0],[12,3]].forEach(([dx,dy])=>{ ctx.beginPath(); ctx.moveTo(wx+14,wy); ctx.lineTo(wx+14+dx,wy+dy); ctx.stroke(); });

    ctx.restore();
  }

  function hitboxOf(m) {
    const S=38, sq=m.squash, bw=Math.round(S/sq), bh=Math.round(S*sq);
    return { x:m.x-bw/2+4, y:m.y-bh+4, w:bw-8, h:bh-5 };
  }
  function overlaps(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

  function drawOverlay(title, sub) {
    ctx.fillStyle='rgba(5,2,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#c8860a'; ctx.beginPath(); ctx.roundRect(W/2-220,H/2-52,440,60,8); ctx.fill();
    ctx.fillStyle='#0d0500'; ctx.textAlign='center'; ctx.font='bold 34px Courier New';
    ctx.fillText(title,W/2,H/2-14);
    ctx.font='15px Courier New'; ctx.fillStyle='#f5deb3';
    ctx.fillText(sub,W/2,H/2+22); ctx.textAlign='left';
  }

  function update() {
    if(state!=='running') return;
    frame++; score++;
    speedMult = 1+Math.floor(score/500)*.18;
    const spd=BASE_SPEED*speedMult;
    bgX+=spd; mtX+=spd*.15;
    trees.forEach(t=>{ t.x-=spd*.7; if(t.x<-60){t.x=W+60;t.h=50+Math.floor(Math.random()*40);} });
    clouds.forEach(c=>{ c.x-=c.speed*speedMult; if(c.x+c.w<0) c.x=W+c.w; });
    if(!manna.onGround){ manna.vy+=GRAVITY; manna.y+=manna.vy; }
    if(manna.y>=GROUND_Y){
      manna.y=GROUND_Y; manna.vy=0;
      if(!manna.onGround) spawnDust(manna.x+10,GROUND_Y+14,5);
      manna.onGround=true;
    }
    const tSq=manna.onGround?1:(manna.vy<0?1.25:.88);
    manna.squash+=(tSq-manna.squash)*.18;
    if(manna.onGround) manna.legPhase+=.25*speedMult;
    manna.tailWag=Math.sin(frame*.13)*4;
    manna.bobble=manna.onGround?Math.sin(manna.legPhase*2)*1.5:0;
    manna.y+=manna.bobble*.4;
    maybeSpawnObstacle();
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i]; o.x-=spd;
      if(o.x+o.w<-30){obstacles.splice(i,1);continue;}
      if(overlaps(hitboxOf(manna),o)){
        state='dead'; if(score>best) best=score;
        spawnExplosion(manna.x+10,manna.y-20);
        document.getElementById('best').textContent=Math.floor(best/6);
      }
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.18; p.life-=p.decay;
      if(p.life<=0) particles.splice(i,1);
    }
    document.getElementById('score').textContent=Math.floor(score/6);
    document.getElementById('speed').textContent=speedMult.toFixed(1);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    drawSky(); drawMountains();
    trees.forEach(t=>drawTree(t.x,t.h));
    clouds.forEach(drawCloud);
    drawGround();
    obstacles.forEach(o=>o.type==='log'?drawLog(o):drawRock(o));
    particles.forEach(p=>{
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
    drawBeaver(manna);
    if(speedMult>1.5){
      ctx.strokeStyle=`rgba(255,200,100,${(speedMult-1.5)*.15})`; ctx.lineWidth=1;
      for(let i=0;i<6;i++){
        const lx=((i*145-bgX*1.2)%(W+60)+W+60)%(W+60)-30, ly=40+i*38;
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-35,ly); ctx.stroke();
      }
    }
    if(state==='idle') drawOverlay('MANNA THE BEAVER','Tap or press SPACE to start!');
    else if(state==='dead') drawOverlay('SPLAT!',`Score: ${Math.floor(score/6)}m  —  Tap or SPACE to retry`);
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  init(); loop();
  </script>
</body>
</html>
